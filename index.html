<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mobile.technoforbes.com</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: system-ui, -apple-system, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }
        .content {
            text-align: center;
            font-size: 1.15rem;
            margin-bottom: 20px;
        }
        .contact-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        .contact-btn:hover {
            background: #444;
        }
        .contact-form {
            display: none;
            background: #222;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            max-width: 400px;
            width: 90%;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #bbb;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .submit-btn {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover {
            background: #555;
        }
        .success-message {
            color: #4CAF50;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="content">
        <p>This Domain <b id="hostname"></b> is taken by <b>7R1X7R41L</b></p>
    </div>
    
    <button class="contact-btn" onclick="showContactForm()">Contact Researcher</button>
    
    <div id="contactForm" class="contact-form">
        <div class="form-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" placeholder="Enter your message"></textarea>
        </div>
        <button class="submit-btn" onclick="sendEmail()">Send Message</button>
        <div id="successMessage" class="success-message">
            Message prepared for sending!
        </div>
    </div>

    <script>
        // Display current hostname
        document.getElementById('hostname').textContent = window.location.hostname;
        
        // Function to show contact form
        function showContactForm() {
            const form = document.getElementById('contactForm');
            const button = document.querySelector('.contact-btn');
            
            if (form.style.display === 'block') {
                form.style.display = 'none';
                button.textContent = 'Contact Researcher';
            } else {
                form.style.display = 'block';
                button.textContent = 'Hide Form';
            }
        }
        
        // Function to send email
        function sendEmail() {
            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            
            if (!name || !message) {
                alert('Please fill in both name and message fields.');
                return;
            }
            
            // Create mailto link with exact email
            const subject = `Contact from Subdomain Takeover PoC - ${window.location.hostname}`;
            const body = `Name: ${name}\nMessage: ${message}\n\nFrom: ${window.location.hostname}`;
            const mailtoLink = `mailto:me.fatalops@proton.me?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            
            // Open email client
            window.location.href = mailtoLink;
            
            // Show success message
            document.getElementById('successMessage').style.display = 'block';
            
            // Reset form
            document.getElementById('name').value = '';
            document.getElementById('message').value = '';
            
            // Hide form after 2 seconds
            setTimeout(() => {
                document.getElementById('contactForm').style.display = 'none';
                document.querySelector('.contact-btn').textContent = 'Contact Researcher';
                document.getElementById('successMessage').style.display = 'none';
            }, 2000);
        }
        
        // Hide form by default
        document.getElementById('contactForm').style.display = 'none';
    </script>
</body>
</html>
